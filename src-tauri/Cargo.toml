[package]
name = "harmolyn"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.77"
description = "Harmolyn — secure chat client for the xorein network"
authors = []
license = "AGPL-3.0"
repository = "https://github.com/cogniloom/harmolyn"

[lib]
name = "harmolyn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs-next = "2.0.0"
libc = "0.2.189"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
