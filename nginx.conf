server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history-fallback: unknown paths serve index.html so react-router works
    # index.html must not be cached so clients always get the latest asset hashes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Vite outputs content-hashed filenames under /assets/ — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
