<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <!-- Pinch-zoom MUST stay enabled (WCAG 2.1 SC 1.4.4). Do not re-add
         maximum-scale/user-scalable=no — it blocks low-vision users from zooming. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1a1b" />
    <!-- frame-ancestors is enforced by the HTTP response header in nginx and by
         the Tauri shell CSP; browsers ignore it when supplied through <meta>. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'self' https://www.youtube-nocookie.com; manifest-src 'self'; connect-src 'self' http: https: ws: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; worker-src 'self' blob:;" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Harmolyn" />
    <title>Harmolyn</title>
    <meta name="description" content="Harmolyn — Aether Chat">
    <meta property="og:title" content="Harmolyn">
  <meta name="twitter:title" content="Harmolyn">
  <meta property="og:description" content="Harmolyn — Aether Chat">
  <meta name="twitter:description" content="Harmolyn — Aether Chat">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:type" content="website">
</head>
  <!-- No app-wide `select-none`: users must be able to select and copy peer IDs,
       invite links, error text and backup blobs. Disable selection locally only
       where it genuinely helps (drag handles), never globally. -->
  <body class="overflow-hidden">
    <div class="fixed inset-0 grid-overlay z-[-1]"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
