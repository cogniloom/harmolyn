name: harmolyn

services:
  harmolyn-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_* values are compiled into the browser bundle.
        VITE_XOREIN_CONTROL_ENDPOINT: ${VITE_XOREIN_CONTROL_ENDPOINT:-https://node.xorein.com}
        VITE_SOURCE_URL: ${VITE_SOURCE_URL:-https://github.com/cogniloom/harmolyn}
    container_name: harmolyn-app
    hostname: harmolyn-app
    restart: unless-stopped
    ports:
      - "${HARMOLYN_APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  harmolyn-webpage:
    build:
      context: ./website
      dockerfile: Dockerfile
      args:
        # This URL is opened by the landing-page CTA in the visitor's browser.
        VITE_HARMOLYN_APP_URL: ${VITE_HARMOLYN_APP_URL:-http://localhost:${HARMOLYN_APP_PORT:-8080}}
        VITE_SOURCE_URL: ${VITE_SOURCE_URL:-https://github.com/cogniloom/harmolyn}
        VITE_XOREIN_URL: ${VITE_XOREIN_URL:-https://xorein.com}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0-rc.1}
    container_name: harmolyn-webpage
    hostname: harmolyn-webpage
    restart: unless-stopped
    ports:
      - "${HARMOLYN_WEBPAGE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
