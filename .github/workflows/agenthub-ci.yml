name: CI
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
permissions:
  contents: read
concurrency:
  group: harmolyn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Lint, Test & Build
    runs-on: self-hosted
    container: node:26-bookworm
    timeout-minutes: 30
    steps:
      # Never execute an external fork on a persistent self-hosted runner.
      - name: Require a trusted repository source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "External-fork code requires isolated runner review."; exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:protocol
      - run: node scripts/test-stabilization-contracts.mjs
      - run: npm --prefix website ci
      - run: npm --prefix website run build

  browser-smoke:
    name: Browser Smoke (E2E)
    runs-on: self-hosted
    container: node:26-bookworm
    timeout-minutes: 25
    steps:
      # Never execute an external fork on a persistent self-hosted runner.
      - name: Require a trusted repository source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "External-fork code requires isolated runner review."; exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run build
      - name: Install lockfile-pinned Chromium
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Boot the production bundle in Chromium
        run: npm run test:browser:ci
        env:
          HARMOLYN_REQUIRE_BROWSER: "1"

      - name: Verify all themes and custom colors in the production application
        run: node scripts/appearance-e2e.mjs
        env:
          HARMOLYN_APPEARANCE_EVIDENCE: .generated/appearance-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence
          path: |
            .generated/appearance-evidence/
            .generated/browser-evidence/
          if-no-files-found: warn
          retention-days: 7

  tauri:
    name: Tauri Debug Build (Linux)
    runs-on: self-hosted
    container: node:26-bookworm
    timeout-minutes: 60
    steps:
      # Never execute an external fork on a persistent self-hosted runner.
      - name: Require a trusted repository source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "External-fork code requires isolated runner review."; exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install native build prerequisites in the isolated build container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            xdg-utils patchelf libgtk-3-dev libssl-dev pkg-config build-essential
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: src-tauri
          key: ci-debian-node26
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build native application without a release bundle
        shell: bash
        run: |
          # Use Rust's canonical host triple instead of the CLI's architecture
          # inference (which rejects feature-suffixed architectures such as x64+ssse3).
          target="$(rustc -vV | sed -n 's/^host: //p')"
          case "$target" in
            x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu) ;;
            *) echo "Unsupported or missing Linux Rust host triple" >&2; exit 1 ;;
          esac
          npm exec -- tauri build --debug --no-bundle --target "$target" -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
