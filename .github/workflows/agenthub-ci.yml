name: AgentHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: agenthub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on GitHub-hosted (cheap, no host secrets) to enforce the fork-PR gate.
  # Hard rule: never execute untrusted fork code on a self-hosted runner.
  trust-gate:
    name: Trust Gate
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif echo '${{ toJSON(github.event.pull_request.labels.*.name) }}' | grep -q '"safe-to-test"'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fork PR — a maintainer must apply the 'safe-to-test' label before CI runs."
          fi

  lint-test:
    name: Lint & Test
    needs: trust-gate
    if: needs.trust-gate.outputs.ok == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:protocol

  browser-smoke:
    name: Browser Smoke (E2E)
    needs: trust-gate
    if: needs.trust-gate.outputs.ok == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Build the production bundle so the smoke exercises the real dist output
      # (Rollup chunks, build-time defines, base path, service worker) — not the dev server.
      - run: npm run build

      # The self-hosted runner runs as a non-root user with the "no new privileges" flag
      # set, so `playwright install --with-deps` (which shells out to sudo) fails. Some
      # runner images preinstall Chromium at /opt/pw-browsers; others don't. Use the
      # preinstalled one when present; otherwise download ONLY the browser binary (no OS
      # deps → no sudo). The version is pinned to the project's playwright-core so the
      # downloaded revision matches what the smoke resolves. The smoke's resolver also
      # globs the install roots version-independently as a safety net, and — if the runner
      # genuinely cannot host a browser (no binary, or missing OS libs like libnspr4) — the
      # smoke skips green with a visible ::notice::, mirroring the Tauri capability gate,
      # rather than blocking the PR on an environment limitation.
      - name: Resolve Chromium for Playwright (no privileged install)
        run: |
          # Newer Playwright revisions ship the binary under chrome-linux64/, older under chrome-linux/.
          CHROME="$(ls /opt/pw-browsers/chromium-*/chrome-linux/chrome /opt/pw-browsers/chromium-*/chrome-linux64/chrome 2>/dev/null | head -1 || true)"
          if [ -n "$CHROME" ]; then
            echo "PLAYWRIGHT_CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
            echo "Using preinstalled Chromium at $CHROME"
          else
            PW_VERSION="$(node -p "require('playwright-core/package.json').version")"
            echo "No preinstalled Chromium found; downloading the browser binary (playwright@${PW_VERSION})."
            npx "playwright@${PW_VERSION}" install chromium
          fi

      - run: npm run test:browser:ci

  tauri-check:
    name: Tauri Debug Build (Linux)
    needs: trust-gate
    if: needs.trust-gate.outputs.ok == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      # The Tauri desktop build needs the webkit2gtk-4.1 dev libraries. On the
      # non-root, no-new-privileges self-hosted runner these cannot be apt-installed
      # (sudo is blocked). Run the real debug build where the libraries are present
      # (provisioned runners), and cleanly skip — with a visible notice — where they
      # are not. Release desktop bundles are produced by release.yml.
      - name: Detect desktop build capability
        id: caps
        run: |
          if pkg-config --exists webkit2gtk-4.1 2>/dev/null && command -v patchelf >/dev/null 2>&1; then
            echo "capable=true" >> "$GITHUB_OUTPUT"
            echo "webkit2gtk-4.1 + patchelf present; running the Tauri debug build."
          else
            echo "capable=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Tauri debug build skipped::webkit2gtk-4.1 dev libraries are unavailable on this self-hosted runner and cannot be installed without root (no-new-privileges). Desktop bundles are built by release.yml on provisioned runners."
          fi

      - uses: actions/setup-node@v5
        if: steps.caps.outputs.capable == 'true'
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.caps.outputs.capable == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.caps.outputs.capable == 'true'
        with:
          workspaces: src-tauri

      - if: steps.caps.outputs.capable == 'true'
        run: npm ci

      - if: steps.caps.outputs.capable == 'true'
        run: npm run build

      - name: Tauri debug build
        if: steps.caps.outputs.capable == 'true'
        run: npx tauri build --debug --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
