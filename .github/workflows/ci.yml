name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & Test
    runs-on: self-hosted
    steps:
      - name: Fix workspace permissions
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || sudo chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - run: npm run test:protocol

  browser-smoke:
    name: Browser Smoke (E2E)
    runs-on: self-hosted
    steps:
      - name: Fix workspace permissions
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || sudo chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright@1.59.1 install --with-deps chromium

      - run: npm run test:browser

  tauri-check:
    name: Tauri Debug Build (Linux)
    runs-on: self-hosted
    steps:
      - name: Fix workspace permissions
        run: chown -R "$(id -u):$(id -g)" . 2>/dev/null || sudo chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run build

      - name: Tauri debug build
        run: npx tauri build --debug --no-bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
