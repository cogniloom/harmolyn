name: Apply reviewed UI changes
on:
  push:
    branches: [codex/harmolyn-ui-polish-2026-09-07]
    paths: ['.github/ui-round2/**', '.github/workflows/ui-round2-assembly.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'cogniloom/harmolyn' && github.ref == 'refs/heads/codex/harmolyn-ui-polish-2026-09-07'
    runs-on: self-hosted
    container: node:26-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Apply hash-verified reviewed source without executing it
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          import { execFileSync } from 'node:child_process';
          const hash = b => createHash('sha256').update(b).digest('hex');
          const first = fs.readFileSync('.github/ui-round2/part1').toString('base64');
          // Restore one transport transcription error before verifying the entire payload.
          const fixed = Buffer.from(first.replace('TRE2ZZ5o', 'TRE2Z5o') + '9', 'base64');
          const raw = gunzipSync(Buffer.concat([fixed, fs.readFileSync('.github/ui-round2/part2')]), { maxOutputLength: 100000 });
          assert.equal(hash(raw), 'e654684682afeb099f9f84bc8a7fdc69d1558956524bb8cf9b10e07d8f6016d5');
          const edits = JSON.parse(raw.toString('utf8'));
          assert.equal(edits.length, 16);
          const allowed = new Set(['.github/workflows/agenthub-ci.yml','scripts/browser-smoke.mjs','scripts/conversation-ui-e2e.mjs','scripts/e2e/scenario-03-messaging.mjs','scripts/fixtures/conversation.tsx','src/components/ChannelRail.test.tsx','src/components/ChannelRail.tsx','src/components/ChatArea.composer.test.tsx','src/components/ChatArea.tsx','src/components/Layout.tsx','src/components/QuickSwitcher.test.tsx','src/components/QuickSwitcher.tsx','src/lib/composerKeys.test.ts','src/lib/composerKeys.ts','src/main.tsx','src/styles/conversation.css']);
          for (const edit of edits) {
            assert.ok(allowed.delete(edit.path), 'Unexpected or repeated path');
            const exists = fs.existsSync(edit.path);
            const old = exists ? fs.readFileSync(edit.path) : Buffer.alloc(0);
            if (edit.path.startsWith('.github/')) {
              assert.equal(hash(old), edit.new, 'CI configuration must already match the reviewed version');
              continue;
            }
            assert.equal(exists ? hash(old) : null, edit.old, 'Source changed: ' + edit.path);
            const lines = old.toString('utf8').match(/[^\n]*\n|[^\n]+$/g) || [];
            for (const [start, end, replacement] of [...edit.ops].reverse()) lines.splice(start, end - start, ...replacement);
            const updated = Buffer.from(lines.join(''));
            assert.equal(hash(updated), edit.new, 'Output hash mismatch: ' + edit.path);
            fs.mkdirSync(path.dirname(edit.path), { recursive: true });
            fs.writeFileSync(edit.path, updated);
            execFileSync('git', ['add', '--', edit.path]);
          }
          assert.equal(allowed.size, 0);
          execFileSync('git', ['diff', '--cached', '--check'], { stdio: 'inherit' });
          execFileSync('git', ['diff', '--cached', '--stat'], { stdio: 'inherit' });
          execFileSync('git', ['-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Improve conversation navigation, readable controls, and draft submission safety'], { stdio: 'inherit' });
          NODE
      - name: Push only the reviewed task branch without force
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:refs/heads/codex/harmolyn-ui-polish-2026-09-07
          git rev-parse HEAD
