name: Dependency refresh
on:
  workflow_dispatch:
  push:
    branches: [codex/harmolyn-stabilization-2026-09-06]
    paths: [.github/workflows/dependency-refresh.yml]
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'cogniloom/harmolyn'
    runs-on: self-hosted
    container: node:26-bookworm
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Recover exact reviewed source and apply verified fixes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          def digest(raw): return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          def blob(sha):
              req=urllib.request.Request('https://api.github.com/repos/cogniloom/harmolyn/git/blobs/'+sha, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=45) as response: value=json.load(response)
              raw=base64.b64decode(value['content'])
              if digest(raw)!=sha: raise SystemExit('Git blob integrity failure')
              return raw
          parts=['7ad3d9e2c02e69ada9674f63196b958d83db3366','13905c718acbd0aead979f4a193aaf4cad18d5c6','bf4955643d2236834067dce4a7ef348c2e2595ac','da248d77da6845ab61bca84cd9814668ec4ab293','a40582d5e73093accb2e58ace78a137c687377e7','0ba606a804efee3c182a82477f4f5c4b03f80611']
          raw=b''.join(blob(sha) for sha in parts)
          if digest(raw)!='1aeb5739bdbd67e28bdedd3000f8ff34abbb93f5': raise SystemExit('Reviewed patch integrity failure')
          plan=json.loads(gzip.decompress(raw))
          expected={**plan['base'],**plan['expected']}
          for name in expected:
              if Path(name).is_absolute() or '..' in Path(name).parts: raise SystemExit('Invalid source path')
          def restore(item):
              name,sha=item; target=Path(name)
              target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(blob(sha))
          with ThreadPoolExecutor(max_workers=4) as pool: list(pool.map(restore,plan['base'].items()))
          patch=plan['patch'].encode()
          subprocess.run(['git','apply','--check','--whitespace=nowarn'],input=patch,check=True)
          subprocess.run(['git','apply','--whitespace=nowarn'],input=patch,check=True)
          for name,sha in expected.items():
              if digest(Path(name).read_bytes())!=sha: raise SystemExit('Source mismatch: '+name)
          out=Path('candidate-evidence'); out.mkdir(exist_ok=True)
          (out/'expected.json').write_text(json.dumps(expected,indent=2))
          print('Verified',len(expected),'source files, including all lockfiles. No Git refs are changed.')
          PY
      - name: Clean installs, production builds, tests and browser verification
        shell: bash
        env:
          HARMOLYN_REQUIRE_BROWSER: '1'
          HARMOLYN_APPEARANCE_EVIDENCE: candidate-evidence/appearance
        run: |
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess,zipfile
          from pathlib import Path
          out=Path('candidate-evidence'); results={}
          def run(name,args,timeout=600):
              with (out/(name+'.log')).open('w') as log:
                  try: code=subprocess.run(args,stdout=log,stderr=subprocess.STDOUT,timeout=timeout).returncode
                  except subprocess.TimeoutExpired: code=124
                  except OSError: code=127
              results[name]=code; print(name+': '+str(code),flush=True)
              return code==0
          run('node-version',['node','--version'])
          if run('npm-ci',['npm','ci','--no-fund']):
              run('lint',['npm','run','lint'])
              run('typecheck',['npm','run','typecheck'])
              built=run('build',['npm','run','build'])
              run('unit-tests',['npm','test','--','--reporter=dot'],900)
              run('protocol-tests',['npm','run','test:protocol'])
              run('contract-tests',['node','scripts/test-stabilization-contracts.mjs'])
              run('npm-audit',['npm','audit','--json'])
              run('npm-outdated',['npm','outdated','--json'])
              if built and run('browser-install',['npx','--no-install','playwright-core','install','--with-deps','chromium']):
                  run('browser-smoke',['npm','run','test:browser:ci'])
                  run('appearance-e2e',['node','scripts/appearance-e2e.mjs'])
                  if Path('.generated/browser-evidence').exists(): shutil.copytree('.generated/browser-evidence',out/'browser',dirs_exist_ok=True)
          if run('website-ci',['npm','--prefix','website','ci','--no-fund']):
              run('website-build',['npm','--prefix','website','run','build'])
              run('website-audit',['npm','--prefix','website','audit','--json'])
          expected=json.loads((out/'expected.json').read_text())
          files=[]
          for name,sha in expected.items():
              source=Path(name); raw=source.read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if actual!=sha: raise SystemExit('Validation mutated reviewed source: '+name)
              target=out/'source'/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(raw)
              files.append({'path':name,'sha':sha})
          (out/'files.json').write_text(json.dumps(files,indent=2))
          (out/'results.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'checks':results},indent=2))
          for folder,label in [('dist','application-dist'),('website/dist','website-dist')]:
              if Path(folder).is_dir():
                  with zipfile.ZipFile(out/(label+'.zip'),'w',zipfile.ZIP_DEFLATED) as z:
                      for p in Path(folder).rglob('*'):
                          if p.is_file(): z.write(p,p.relative_to(folder))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-evidence
          path: candidate-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Require every validation gate to pass
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('candidate-evidence/results.json').read_text())['checks']
          required=['npm-ci','lint','typecheck','build','unit-tests','protocol-tests','contract-tests','website-ci','website-build','browser-smoke','appearance-e2e']
          failed=[name for name in required if data.get(name)!=0]
          if failed: raise SystemExit('Failed candidate checks: '+', '.join(failed))
          PY
  retain-blobs:
    if: always() && github.repository == 'cogniloom/harmolyn'
    needs: candidate
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      # No checkout and no execution of candidate code with write credentials.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-evidence
          path: evidence
      - name: Store verified source as unreferenced Git blobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,urllib.request
          files=json.loads(Path('evidence/files.json').read_text())
          expected=json.loads(Path('evidence/expected.json').read_text())
          for item in files:
              name=item['path']
              if Path(name).is_absolute() or '..' in Path(name).parts or name not in expected: raise SystemExit('Invalid source path')
              raw=Path('evidence/source',name).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if sha!=item['sha'] or sha!=expected[name]: raise SystemExit('Source integrity failure')
              req=urllib.request.Request('https://api.github.com/repos/cogniloom/harmolyn/git/blobs',data=json.dumps({'content':raw.decode(),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=45) as response: result=json.load(response)
              if result['sha']!=sha: raise SystemExit('Git integrity failure')
          Path('evidence/blob-manifest.json').write_text(json.dumps(files,indent=2))
          print('Source blobs retained; no branch, release or tag updated.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-blob-manifest
          path: evidence/blob-manifest.json
          if-no-files-found: error
          retention-days: 3
