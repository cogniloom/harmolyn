name: PR78 recovery layout assembly
on:
  push:
    branches: [codex/harmolyn-pr78-source-check]
permissions:
  contents: read
jobs:
  assemble:
    runs-on: self-hosted
    container: node:26-bookworm
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d598d158141b553cdc04c2b351b62e8f5f550a32
          persist-credentials: false
      - name: Assemble reviewed source and publish hash-verified objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const replace = (s, before, after) => { assert.equal(s.split(before).length, 2); return s.replace(before, after); };
          const chat = 'src/components/ChatArea.tsx';
          let s = fs.readFileSync(chat, 'utf8');
          s = replace(s, '  const failedSubmissionRef = useRef<RetryableSubmission | null>(null);', '  const failedSubmissionRef = useRef<RetryableSubmission | null>(null);\n  const failedRecoveryRef = useRef<HTMLElement>(null);');
          s = replace(s, 'Message could not be sent. Retry or discard the unsent message below. Your current draft is unchanged.', 'Message could not be sent. Your current draft is unchanged.');
          const start = s.indexOf('            {activeFailedSubmission && (\n');
          const end = s.indexOf('\n\n            {/* Reply Preview Bar */}', start);
          assert.ok(start >= 0 && end > start);
          let block = s.slice(start, end);
          s = s.slice(0, start) + s.slice(end);
          block = block.split('\n').map(line => line.startsWith('    ') ? line.slice(4) : line).join('\n');
          block = replace(block, '<section className="chat-failed-submission"', '<section ref={failedRecoveryRef} className="chat-failed-submission"');
          s = replace(s, '        })}\n      </div>\n\n      {/* Pinned Messages Drawer */}', '        })}\n        {/* Recovery belongs to the scrollable history, never the editor height. */}\n' + block + '\n      </div>\n\n      {/* Pinned Messages Drawer */}');
          s = replace(s, `    if (scrollRef.current) {
                scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                setIsScrolledUp(false);
              }
            }, []);`, `    const viewport = scrollRef.current;
              if (viewport) {
                const recovery = failedRecoveryRef.current;
                if (recovery) {
                  // On short screens, keep Retry/Discard visible at the card's start.
                  // Scroll only the conversation, not the page or the focused editor.
                  viewport.scrollTop += recovery.getBoundingClientRect().top - viewport.getBoundingClientRect().top;
                } else {
                  viewport.scrollTop = viewport.scrollHeight;
                }
                setIsScrolledUp(false);
              }
            }, []);`);
          s = replace(s, '[channel, messageLayout, normalizedMessages, normalizedSearch, scrollToBottom]);', '[channel, messageLayout, normalizedMessages, normalizedSearch, activeFailedSubmission, scrollToBottom]);');
          fs.writeFileSync(chat,s);
          const css = 'src/styles/conversation.css';
          s = replace(fs.readFileSync(css,'utf8'), '/* Keep recoverable submissions bounded and readable without covering the composer. */', '/* Recovery scrolls with history; its actions stay visible while reading the copy. */');
          s += '\n.chat-failed-heading { position: sticky; top: 0; z-index: 1; background: var(--appearance-surface); }\n';
          fs.writeFileSync(css,s);
          const test = 'src/components/ChatArea.composer.test.tsx';
          const assertion = "    expect(within(screen.getByRole('region', { name: 'Unsent message' })).getByText('private draft')).toBeInTheDocument();";
          s = replace(fs.readFileSync(test,'utf8'), assertion, assertion + `
              const recovery = screen.getByRole('region', { name: 'Unsent message' });
              expect(recovery.closest('.chat-message-list')).not.toBeNull();
              expect(recovery.closest('.chat-composer')).toBeNull();`);
          fs.writeFileSync(test,s);
          const browser = 'scripts/conversation-ui-e2e.mjs';
          const loop = "    for (const action of ['Retry unsent message', 'Discard unsent message']) {";
          s = replace(fs.readFileSync(browser,'utf8'), loop, "    const recoveryToolbar = await page.locator('.chat-toolbar').boundingBox();\n    const recoveryComposer = await page.locator('.chat-composer').boundingBox();\n" + loop);
          const bounds = "      assert.ok(box.x >= 0 && box.y >= 0 && box.x + box.width <= width + 1 && box.y + box.height <= (width === 320 ? 569 : 845), `Unreachable ${action} at ${width}`);";
          s = replace(s, bounds, bounds + `
                assert.ok(box.y >= recoveryToolbar.y + recoveryToolbar.height && box.y + box.height <= recoveryComposer.y, \`Recovery action covered by fixed controls at \${width}\`);
                assert.ok(await recovery.getByRole('button', { name: action, exact: true }).evaluate(button => {
                  const rect = button.getBoundingClientRect();
                  return button.contains(document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2));
                }), \`Recovery action obscured at \${width}\`);`);
          fs.writeFileSync(browser,s);
          const expected = {
            'src/components/ChatArea.tsx':['40e55d849adf6c1eea43850dec51f2c2b30d750b044602b804c7825dfe412004','4dc619a60b851fa52d195e38bce4d94ef99e5f94'],
            'src/styles/conversation.css':['da0a906eff1e0c2fa12ab74493a1ce9cb31cc42fbd4cf5f000128dcac034ed12','b9df128b7319430ae1e56e8f935136e2fb2168b5'],
            'src/components/ChatArea.composer.test.tsx':['ba4f3d59be1635cd6337ddf40130cf98b8b1d0ffd1e1a05fce93c7dfdbb499c0','3ab8dc516953716a78083fb141b8de92f1cde278'],
            'scripts/conversation-ui-e2e.mjs':['6fb014ad0c5ce4f46dbabe59f9f695b02e013acff9a83133a7729f60e70d107f','b917742e20a394807b57d4f2ff1c1d2c78e36acf']
          };
          const tree=[];
          for (const [file,[hash,sha]] of Object.entries(expected)) {
            const content=fs.readFileSync(file);
            assert.equal(crypto.createHash('sha256').update(content).digest('hex'),hash,file);
            const response=await fetch('https://api.github.com/repos/cogniloom/harmolyn/git/blobs', {
              method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              body:JSON.stringify({content:content.toString('base64'),encoding:'base64'})
            });
            if(!response.ok)throw new Error(`Object API status ${response.status}`);
            const blob=await response.json();assert.equal(blob.sha,sha);tree.push({path:file,mode:'100644',type:'blob',sha});
          }
          const out=path.join(process.env.RUNNER_TEMP,'recovery-objects');fs.mkdirSync(out,{recursive:true});
          fs.writeFileSync(path.join(out,'tree.json'),JSON.stringify(tree));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr78-recovery-layout-manifest
          path: ${{ runner.temp }}/recovery-objects/
          retention-days: 1
          if-no-files-found: error
