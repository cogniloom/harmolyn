name: PR78 reproducible local verification
on:
  push:
    branches: [codex/harmolyn-pr78-source-check]
permissions:
  contents: read
jobs:
  export:
    runs-on: self-hosted
    container: node:26-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c167d96bc83bf437f19f06c7401b9d6107fef945
          persist-credentials: false
      - name: Export immutable tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = c167d96bc83bf437f19f06c7401b9d6107fef945
          mkdir -p "$RUNNER_TEMP/pr78-source" "$RUNNER_TEMP/pr78-tools"
          git -c safe.directory="$GITHUB_WORKSPACE" archive --format=zip HEAD > "$RUNNER_TEMP/pr78-source/source.zip"
          printf '%s\n' c167d96bc83bf437f19f06c7401b9d6107fef945 > "$RUNNER_TEMP/pr78-source/commit.txt"
      - run: npm ci
      - name: Export installed lockfile dependencies and matching Node executable
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/pr78-tools/node_modules.tar.gz" node_modules
          cp "$(command -v node)" "$RUNNER_TEMP/pr78-tools/node"
          gzip "$RUNNER_TEMP/pr78-tools/node"
          sha256sum package-lock.json > "$RUNNER_TEMP/pr78-tools/package-lock.sha256"
          node --version > "$RUNNER_TEMP/pr78-tools/node-version.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr78-source-c167
          path: ${{ runner.temp }}/pr78-source/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr78-locked-tools-c167
          path: ${{ runner.temp }}/pr78-tools/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
