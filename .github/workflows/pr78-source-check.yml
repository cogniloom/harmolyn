name: PR78 reviewed fix assembly
on:
  push:
    branches: [codex/harmolyn-pr78-source-check]
permissions:
  contents: read
jobs:
  assemble:
    permissions:
      contents: write
    runs-on: self-hosted
    container: node:26-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c167d96bc83bf437f19f06c7401b9d6107fef945
          persist-credentials: false
      - name: Apply reviewed data and publish immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const repo = 'cogniloom/harmolyn';
          const git = (...args) => execFileSync('git', ['-c', `safe.directory=${process.cwd()}`, ...args], { encoding: 'utf8' });
          assert.equal(git('rev-parse', 'HEAD').trim(), 'c167d96bc83bf437f19f06c7401b9d6107fef945');
          const sha256 = value => crypto.createHash('sha256').update(value).digest('hex');
          async function api(endpoint, body) {
            const response = await fetch(`https://api.github.com/repos/${repo}/${endpoint}`, {
              method: body ? 'POST' : 'GET',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            if (!response.ok) throw new Error(`GitHub object API status ${response.status}`);
            return response.json();
          }
          const parts = [];
          for (const sha of ['0d6cc4c54a109565f4628ffc28110b51fdafe55a', '60e2c291c8ef1ce0b537211d9b106101021bce0b', '1bdb6ebf07424511f0bbacb47f3fddacd5846a04']) {
            const blob = await api(`git/blobs/${sha}`);
            assert.equal(blob.sha, sha);
            parts.push(Buffer.from(blob.content, 'base64'));
          }
          const patch = gunzipSync(Buffer.concat(parts), { maxOutputLength: 1048576 });
          assert.equal(sha256(patch), '2c1c452e4eaffd74825765ad5795e5769993fb2dc7643fc15bb581dab3ad48a3');
          const patchPath = path.join(process.env.RUNNER_TEMP, 'reviewed.patch');
          fs.writeFileSync(patchPath, patch);
          git('apply', '--check', patchPath);
          git('apply', '--index', patchPath);
          const expected = {
            'scripts/conversation-ui-e2e.mjs':'f65195fc7c55ff9ce48a6977b64a69aaa167a658a903dfeab6df16c67b924536',
            'scripts/fixtures/conversation.tsx':'503e97c0c939a5bf6a3087b122aec4f8ab6472bf7fab821e53687d29f258da15',
            'scripts/fixtures/sendRuntime.ts':'c46d81c5ee8d829bb7f64d39252fe7962ca3f4a4e4cdfbe81444859b80869a13',
            'scripts/fixtures/sendSupport.ts':'374e71753546e8521a9a5cbae1792b5f1c00790fe8bb71e75b61a6243fc1a10d',
            'src/components/ChannelRail.test.tsx':'bedd45c61bb23269ab2b38ad2f2656d3f6199218b72e70e39f7355f9c648a607',
            'src/components/ChannelRail.tsx':'d296a63c0f61dab7f78bcae2f52b161c0dd69412941c3b2d0b647de6186e3105',
            'src/components/ChatArea.accessibility.test.tsx':'531dca6be0a28af22f96788d4ade966f3a3f8236099b45ce9bcdfdc0f70bc054',
            'src/components/ChatArea.composer.test.tsx':'445aa806a96a0e19444338a1be75d1ee7b1e71cd65d9c0619d3495bb6ca8a5cb',
            'src/components/ChatArea.inbox.test.tsx':'caf52b662a03ce620ec784b7bff9fcbbe6b3c90b2e163ed91d6d6ce0c6b9cbea',
            'src/components/ChatArea.merge.test.tsx':'b32c1849ba4c7b7034070158fe38b9338dacfd72d52a4fbd7d5eceeae8e81885',
            'src/components/ChatArea.tsx':'808b9675a50429d1f9d9180995fbfb9fcda8aa08031dc4353d98507e0d9af366',
            'src/components/Layout.quickNavigate.test.tsx':'b78a3d21faec293d8b96b29d38f912599c4b7a57f2cd206c45c0d60fb11bfd90',
            'src/components/Layout.tsx':'43e9a5cf40ba8ae826660863160dcabb34003da3eebdf186c3e788eb0bdb2c36',
            'src/styles/conversation.css':'246749e7152ac441789c34fa8cf6e3a5cada7ca6beaa6c38be3ed9be11164d37'
          };
          assert.deepEqual(git('diff','--cached','--name-only').trim().split('\n').sort(), Object.keys(expected).sort());
          const tree = [];
          for (const [file, checksum] of Object.entries(expected)) {
            const content = fs.readFileSync(file);
            assert.equal(sha256(content), checksum, file);
            const blob = await api('git/blobs', { content: content.toString('base64'), encoding: 'base64' });
            tree.push({ path: file, mode: '100644', type: 'blob', sha: blob.sha });
          }
          const output = path.join(process.env.RUNNER_TEMP,'pr78-reviewed');
          fs.mkdirSync(output, { recursive: true });
          fs.writeFileSync(path.join(output,'tree.json'), JSON.stringify(tree, null, 2));
          console.log(JSON.stringify({ verifiedFiles: tree.length, tree }));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr78-reviewed-object-manifest
          path: ${{ runner.temp }}/pr78-reviewed/
          retention-days: 1
          if-no-files-found: error
