name: PR78 settled drawer verification assembly
on:
  push:
    branches: [codex/harmolyn-pr78-source-check]
permissions:
  contents: read
jobs:
  assemble:
    runs-on: self-hosted
    container: node:26-bookworm
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 85e5b72dfaa2bf53c9271f4fbb01a7b7d010e0b5
          persist-credentials: false
      - name: Verify exact browser test and publish immutable object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const file = 'scripts/conversation-ui-e2e.mjs';
          const before = `    await drawer.waitFor();
              assert.ok(await drawer.evaluate(el => el.contains(document.activeElement)));
              const rect = await drawer.boundingBox();
              assert.ok(rect.x >= 0 && rect.y >= 0 && rect.x + rect.width <= width + 1 && rect.y + rect.height <= (width === 320 ? 569 : 845));`;
          const after = `    await drawer.waitFor();
              assert.ok(await drawer.evaluate(el => el.contains(document.activeElement)));
              // Normal motion deliberately enters from outside the viewport. Measure the
              // settled drawer, rather than whichever animation frame follows visibility.
              await page.waitForFunction(() => {
                const dialog = document.querySelector('[role="dialog"][aria-label="Pinned messages"]');
                return dialog && dialog.getAnimations().every(animation => animation.playState !== 'running');
              }, undefined, { timeout: 3000 });
              const rect = await drawer.boundingBox();
              assert.ok(rect.x >= 0 && rect.y >= 0 && rect.x + rect.width <= width + 1 && rect.y + rect.height <= (width === 320 ? 569 : 845), \`Pinned drawer clipped at \${width}: \${JSON.stringify(rect)}\`);`;
          const source = fs.readFileSync(file, 'utf8');
          assert.equal(source.split(before).length, 2);
          const content = Buffer.from(source.replace(before, after));
          assert.equal(crypto.createHash('sha256').update(content).digest('hex'), '808a6302a452add767a34ab1326ec0ff28f93d06ebd7292aa01cb4bac3b96dbf');
          const response = await fetch('https://api.github.com/repos/cogniloom/harmolyn/git/blobs', {
            method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json' },
            body: JSON.stringify({ content: content.toString('base64'), encoding: 'base64' })
          });
          if(!response.ok) throw new Error(`Object API status ${response.status}`);
          const blob = await response.json();
          assert.equal(blob.sha, '38fa8ec5c9fe6dc71849f8ac7a479172278cf585');
          const out = path.join(process.env.RUNNER_TEMP, 'drawer-object'); fs.mkdirSync(out, { recursive:true });
          fs.writeFileSync(path.join(out, 'tree.json'), JSON.stringify([{ path:file, mode:'100644', type:'blob', sha:blob.sha }]));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr78-drawer-test-manifest
          path: ${{ runner.temp }}/drawer-object/
          retention-days: 1
          if-no-files-found: error
