name: PR78 local visual verification bundle
on:
  push:
    branches: [codex/harmolyn-pr78-source-check]
permissions:
  contents: read
jobs:
  preview:
    runs-on: self-hosted
    container: node:26-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1d37d62e5908f5eff385eb46af5cb0ce436f700b
          persist-credentials: false
      - run: npm ci
      - run: npm run build
      - name: Build the same real-component fixture for local visual inspection
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { build } from 'vite';
          import react from '@vitejs/plugin-react';
          const root = process.cwd();
          const fixture = path.join(root, '.generated/local-preview');
          await fs.mkdir(fixture, { recursive: true });
          await fs.writeFile(path.join(fixture, 'index.html'), '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harmolyn conversation UI verification</title></head><body><div id="root"></div><script type="module" src="/scripts/fixtures/conversation.tsx"></script></body></html>');
          await build({ configFile: false, root, plugins: [react()], resolve: { alias: { '@': path.join(root, 'src') } }, define: { __APP_VERSION__: JSON.stringify('ui-test') }, build: { outDir: 'preview-dist', emptyOutDir: true, rollupOptions: { input: path.join(fixture, 'index.html') } } });
          await fs.writeFile('preview-dist/commit.txt', '1d37d62e5908f5eff385eb46af5cb0ce436f700b');
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr78-renderable-bundles
          path: |
            dist/
            preview-dist/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
