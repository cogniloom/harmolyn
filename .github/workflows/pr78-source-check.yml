name: PR78 menu fix assembly
on:
  push:
    branches: [codex/harmolyn-pr78-source-check]
permissions:
  contents: read
jobs:
  assemble:
    runs-on: self-hosted
    container: node:26-bookworm
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c0ee38411601c388523d53d6ecfd925061dc8872
          persist-credentials: false
      - name: Verify reviewed patch and publish immutable objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { gunzipSync } from 'node:zlib';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const git = (...args) => execFileSync('git', ['-c', `safe.directory=${process.cwd()}`, ...args], { encoding:'utf8' });
          assert.equal(git('rev-parse','HEAD').trim(), 'c0ee38411601c388523d53d6ecfd925061dc8872');
          const digest = value => crypto.createHash('sha256').update(value).digest('hex');
          const encoded = '';
          const patch = gunzipSync(Buffer.from(encoded, 'base64'), { maxOutputLength:1048576 });
          assert.equal(digest(patch), '68d82805ec3bd01db52a81dd050cdfdfa5499fde3c1d694a78ea2e0db3107e74');
          const file = path.join(process.env.RUNNER_TEMP, 'menu.patch'); fs.writeFileSync(file,patch);
          git('apply','--check',file); git('apply','--index',file);
          const expected = {
            'src/components/GlobalContextMenu.tsx':'acd2ad39cf42c2ae0d54e16dcb63b30bc2e8abbfaec01d33431be940614eb061',
            'src/components/ContextMenu.keyboard.test.tsx':'42151783892f566fd078c2ef59ed6d5558542283e28b95f059e0e1636689fdd0',
            'scripts/conversation-ui-e2e.mjs':'73e87305c7ad45e122c25758c2b008237492d036d36703b03c71e48c011dffa3'
          };
          assert.deepEqual(git('diff','--cached','--name-only').trim().split('\n').sort(), Object.keys(expected).sort());
          const tree=[];
          for (const [file, hash] of Object.entries(expected)) {
            const content=fs.readFileSync(file); assert.equal(digest(content),hash,file);
            const response=await fetch('https://api.github.com/repos/cogniloom/harmolyn/git/blobs', {
              method:'POST',headers:{ Authorization:`Bearer ${process.env.GH_TOKEN}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json' },
              body:JSON.stringify({ content:content.toString('base64'), encoding:'base64' })
            });
            if(!response.ok) throw new Error(`Object API status ${response.status}`);
            const blob=await response.json(); tree.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
          }
          const out=path.join(process.env.RUNNER_TEMP,'menu-objects');fs.mkdirSync(out,{recursive:true});
          fs.writeFileSync(path.join(out,'tree.json'),JSON.stringify(tree));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr78-menu-object-manifest
          path: ${{ runner.temp }}/menu-objects/
          retention-days: 1
          if-no-files-found: error
