name: Apply reviewed UI follow-up
on:
  push:
    branches: [codex/harmolyn-ui-polish-2026-09-07]
    paths: ['.github/ui-refinement-delta.json', '.github/workflows/ui-refinement-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'cogniloom/harmolyn' && github.ref == 'refs/heads/codex/harmolyn-ui-polish-2026-09-07'
    runs-on: self-hosted
    container: node:26-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Apply reviewed source with input and output hash checks
        shell: bash
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const hash = b => createHash('sha256').update(b).digest('hex');
          const edits = JSON.parse(fs.readFileSync('.github/ui-refinement-delta.json', 'utf8'));
          const allowed = new Set(['src/components/ChatArea.tsx','src/components/QuickSwitcher.tsx','src/components/ChannelRail.tsx','src/components/ChatArea.composer.test.tsx','src/components/QuickSwitcher.test.tsx','src/components/ChannelRail.test.tsx','src/components/ChatArea.merge.test.tsx']);
          for (const edit of edits) {
            assert.ok(allowed.delete(edit.path), 'Unexpected or repeated path');
            const old = fs.readFileSync(edit.path);
            assert.equal(hash(old), edit.old, 'Source changed: ' + edit.path);
            const lines = old.toString('utf8').match(/[^\n]*\n|[^\n]+$/g) || [];
            for (const [start,end,replacement] of [...edit.ops].reverse()) lines.splice(start,end-start,...replacement);
            const updated = Buffer.from(lines.join(''));
            assert.equal(hash(updated), edit.new, 'Output mismatch: ' + edit.path);
            fs.writeFileSync(edit.path, updated);
            execFileSync('git',['add','--',edit.path]);
          }
          assert.equal(allowed.size,0);
          execFileSync('git',['diff','--cached','--check'],{stdio:'inherit'});
          execFileSync('git',['-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Fix reviewed draft, live-navigation and filter state edge cases'],{stdio:'inherit'});
          NODE
      - name: Push only the task branch without force
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=2 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_KEY_1=safe.directory GIT_CONFIG_VALUE_1="$PWD"
          git push origin HEAD:refs/heads/codex/harmolyn-ui-polish-2026-09-07
          git rev-parse HEAD
